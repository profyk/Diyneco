<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t"><title id="t">Illustration of a hotel reception desk</title>
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F2EA"/><stop offset="1" stop-color="#EDE3D4"/></linearGradient>
<linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B2350"/><stop offset="1" stop-color="#132F66"/></linearGradient>
<radialGradient id="glow" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#FFE9B8" stop-opacity=".8"/><stop offset="1" stop-color="#FFE9B8" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="800" fill="url(#wall)"/>
<rect y="640" width="1200" height="160" fill="#D8C7AE"/>
<g fill="#E9DCC7"><rect x="0" y="640" width="200" height="160"/><rect x="400" y="640" width="200" height="160"/><rect x="800" y="640" width="200" height="160"/></g>
<!-- wood wall panel -->
<rect x="250" y="80" width="700" height="360" rx="8" fill="#B7804B"/>
<g stroke="#9C6A39" stroke-width="4"><path d="M330 80v360M410 80v360M490 80v360M570 80v360M650 80v360M730 80v360M810 80v360M890 80v360"/></g>
<rect x="420" y="150" width="360" height="90" rx="10" fill="#0B2350"/>
<text x="600" y="210" text-anchor="middle" font-family="Georgia, serif" font-size="46" letter-spacing="8" fill="#fff">RECEPTION</text>
<!-- pendant lights -->
<g><path d="M400 0v120M600 0v100M800 0v120" stroke="#0B2350" stroke-width="4"/>
<circle cx="400" cy="140" r="26" fill="#F6B26B"/><circle cx="600" cy="120" r="26" fill="#F6B26B"/><circle cx="800" cy="140" r="26" fill="#F6B26B"/>
<ellipse cx="600" cy="300" rx="420" ry="220" fill="url(#glow)" opacity=".5"/></g>
<!-- receptionist -->
<circle cx="640" cy="372" r="38" fill="#8D5A3B"/><path d="M604 360c0-34 18-52 36-52s38 16 38 48c-14-16-40-22-74 4z" fill="#1F1A17"/>
<path d="M570 500c0-60 30-92 70-92s70 32 70 92z" fill="#1E7FD8"/><path d="M628 412l12 24 12-24z" fill="#fff"/>
<!-- desk -->
<rect x="200" y="460" width="800" height="200" rx="18" fill="url(#desk)"/>
<rect x="180" y="440" width="840" height="34" rx="10" fill="#2CC9C0"/>
<rect x="240" y="510" width="720" height="6" rx="3" fill="#1E7FD8" opacity=".6"/>
<!-- monitor -->
<rect x="440" y="360" width="130" height="86" rx="8" fill="#0B2350"/><rect x="448" y="368" width="114" height="66" rx="4" fill="#EEF4FB"/>
<rect x="456" y="378" width="60" height="8" rx="3" fill="#1E7FD8"/><rect x="456" y="394" width="96" height="6" rx="3" fill="#C9D9EC"/><rect x="456" y="406" width="80" height="6" rx="3" fill="#C9D9EC"/><rect x="456" y="418" width="40" height="8" rx="3" fill="#16B57A"/>
<rect x="498" y="446" width="14" height="10" fill="#0B2350"/>
<!-- bell and cards -->
<path d="M760 440a30 30 0 0 1 60 0z" fill="#F6B26B"/><rect x="755" y="436" width="70" height="8" rx="4" fill="#C98A3E"/><circle cx="790" cy="406" r="5" fill="#C98A3E"/>
<g transform="rotate(-12 880 430)"><rect x="850" y="414" width="60" height="38" rx="6" fill="#fff" stroke="#0B2350" stroke-width="3"/><rect x="858" y="424" width="24" height="6" rx="3" fill="#1E7FD8"/></g>
<!-- plants -->
<g><rect x="70" y="560" width="90" height="100" rx="12" fill="#0B2350"/><path d="M115 560c-60-60-40-170 0-230 40 60 60 170 0 230z" fill="#16B57A"/><path d="M115 560c-80-30-100-120-80-170 50 30 90 90 80 170z" fill="#139A68"/><path d="M115 560c80-30 100-120 80-170-50 30-90 90-80 170z" fill="#139A68"/></g>
<g><rect x="1040" y="560" width="90" height="100" rx="12" fill="#0B2350"/><path d="M1085 560c-60-60-40-170 0-230 40 60 60 170 0 230z" fill="#16B57A"/><path d="M1085 560c-80-30-100-120-80-170 50 30 90 90 80 170z" fill="#139A68"/></g>
</svg>

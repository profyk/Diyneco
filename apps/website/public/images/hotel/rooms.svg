<g fill="#FFE9B8"><rect x="862" y="275" width="8" height="8"/><rect x="882" y="300" width="8" height="8"/><rect x="975" y="260" width="8" height="8"/><rect x="995" y="290" width="8" height="8"/><rect x="975" y="330" width="8" height="8"/><rect x="1042" y="310" width="8" height="8"/></g>
<circle cx="1040" cy="170" r="22" fill="#FFE9B8"/>
<rect x="926" y="126" width="8" height="268" fill="#fff"/>
<!-- curtains -->
<path d="M740 95h70c-10 110 0 230 20 330h-90z" fill="#1E7FD8"/><path d="M1120 95h-70c10 110 0 230-20 330h90z" fill="#1E7FD8"/>
<rect x="730" y="88" width="400" height="12" rx="6" fill="#0B2350"/>

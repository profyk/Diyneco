<path d="M262 268l60-60 40 36 30-24 46 48z" fill="#16B57A"/><circle cx="410" cy="190" r="16" fill="#F6B26B"/>
<!-- bed -->
<rect x="110" y="330" width="520" height="190" rx="22" fill="#0B2350"/>
<rect x="90" y="470" width="580" height="150" rx="20" fill="#fff"/>
<rect x="90" y="520" width="580" height="100" rx="20" fill="#2CC9C0"/>
<rect x="90" y="520" width="580" height="18" fill="#22B3AB"/>
<rect x="140" y="420" width="200" height="80" rx="30" fill="#fff" stroke="#DCE8F5" stroke-width="4"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t"><title id="t">Illustration of a guest room with a tablet on the bedside table</title>
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEF4FB"/><stop offset="1" stop-color="#DCE8F5"/></linearGradient>
<linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B2350"/><stop offset="1" stop-color="#1E4F8F"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9955F"/><stop offset="1" stop-color="#A9743F"/></linearGradient>
<radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9B8" stop-opacity=".9"/><stop offset="1" stop-color="#FFE9B8" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="800" fill="url(#wall)"/>
<rect y="600" width="1200" height="200" fill="url(#floor)"/>
<g opacity=".18" stroke="#7A4E25" stroke-width="3"><path d="M0 650H1200M0 710H1200M0 770H1200"/></g>
<!-- window -->
<rect x="760" y="110" width="340" height="300" rx="10" fill="#fff"/>
<rect x="776" y="126" width="308" height="268" rx="4" fill="url(#night)"/>

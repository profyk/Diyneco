<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t"><title id="t">Illustration of a hotel pool with loungers</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9AD3F5"/><stop offset="1" stop-color="#E4F4FC"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2CC9C0"/><stop offset="1" stop-color="#1E7FD8"/></linearGradient>
</defs>
<rect width="1200" height="800" fill="url(#sky)"/>
<circle cx="160" cy="120" r="54" fill="#FFE9B8"/>
<!-- back building -->
<rect x="560" y="140" width="560" height="300" fill="#fff"/><rect x="540" y="120" width="600" height="28" rx="6" fill="#0B2350"/>
<g fill="#1E7FD8" opacity=".85"><rect x="600" y="180" width="80" height="70" rx="6"/><rect x="720" y="180" width="80" height="70" rx="6"/><rect x="840" y="180" width="80" height="70" rx="6"/><rect x="960" y="180" width="80" height="70" rx="6"/><rect x="600" y="300" width="80" height="70" rx="6"/><rect x="720" y="300" width="80" height="70" rx="6"/><rect x="840" y="300" width="80" height="70" rx="6"/><rect x="960" y="300" width="80" height="70" rx="6"/></g>
<!-- trees -->
<g fill="#16B57A"><circle cx="120" cy="400" r="80"/><circle cx="220" cy="370" r="90"/><circle cx="340" cy="400" r="80"/><circle cx="460" cy="380" r="76"/></g>
<rect y="430" width="1200" height="370" fill="#F3E9DC"/>
<g stroke="#E2D2BC" stroke-width="3" opacity=".8"><path d="M0 500H1200M0 580H1200M0 660H1200M0 740H1200"/></g>
<!-- pool -->
<path d="M140 520h900a40 40 0 0 1 40 40v120a40 40 0 0 1-40 40H140a40 40 0 0 1-40-40V560a40 40 0 0 1 40-40z" fill="#fff"/>
<path d="M156 536h868a28 28 0 0 1 28 28v112a28 28 0 0 1-28 28H156a28 28 0 0 1-28-28V564a28 28 0 0 1 28-28z" fill="url(#water)"/>
<g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".6"><path d="M220 580c30-14 60 14 90 0s60 14 90 0"/><path d="M560 620c30-14 60 14 90 0s60 14 90 0"/><path d="M340 670c30-14 60 14 90 0s60 14 90 0"/><path d="M800 570c30-14 60 14 90 0"/></g>
<!-- ladder -->
<g stroke="#C9D3DE" stroke-width="8" fill="none" stroke-linecap="round"><path d="M980 500v80M1010 500v80"/><path d="M980 500c0-20 30-20 30 0"/></g>
<!-- umbrella -->
<path d="M260 470l6-170" stroke="#0B2350" stroke-width="8"/><path d="M140 310c40-60 210-60 250 0z" fill="#F6B26B"/><path d="M140 310c25-10 60-10 84 0 26-10 60-10 84 0 26-10 58-10 82 0" fill="none" stroke="#C98A3E" stroke-width="4"/>
<!-- loungers -->
<g><path d="M300 470l70-60h230l-20 60z" fill="#fff" stroke="#0B2350" stroke-width="6"/><path d="M310 470v24M590 470v24" stroke="#0B2350" stroke-width="8"/><rect x="380" y="420" width="200" height="20" rx="8" fill="#1E7FD8"/></g>
<g><path d="M680 470l70-60h230l-20 60z" fill="#fff" stroke="#0B2350" stroke-width="6"/><path d="M690 470v24M970 470v24" stroke="#0B2350" stroke-width="8"/><rect x="760" y="420" width="200" height="20" rx="8" fill="#2CC9C0"/></g>
<!-- towels and drink -->
<rect x="150" y="760" width="160" height="26" rx="8" fill="#1E7FD8"/><rect x="170" y="740" width="120" height="22" rx="8" fill="#fff"/>
<path d="M1060 740h40l-6 46h-28z" fill="#FFE9B8" stroke="#fff" stroke-width="3"/><circle cx="1096" cy="738" r="10" fill="#16B57A"/>
</svg>

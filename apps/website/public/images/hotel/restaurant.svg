<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t"><title id="t">Illustration of a hotel restaurant at dinner time</title>
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14306A"/><stop offset="1" stop-color="#0B2350"/></linearGradient>
<linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6B26B"/><stop offset="1" stop-color="#E9806B"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9B8" stop-opacity=".7"/><stop offset="1" stop-color="#FFE9B8" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="800" fill="url(#wall)"/>

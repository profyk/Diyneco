<g fill="#1E7FD8"><g id="row"><rect x="360" y="220" width="70" height="60" rx="6"/><rect x="460" y="220" width="70" height="60" rx="6"/><rect x="670" y="220" width="70" height="60" rx="6"/><rect x="770" y="220" width="70" height="60" rx="6"/><rect x="565" y="220" width="70" height="60" rx="6"/></g>

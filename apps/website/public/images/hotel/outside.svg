<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t"><title id="t">Illustration of a hotel building on a sunny day</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7EC3F2"/><stop offset="1" stop-color="#D6EEFB"/></linearGradient>
<linearGradient id="bldg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E7EEF6"/></linearGradient>
</defs>
<rect width="1200" height="800" fill="url(#sky)"/>
<circle cx="1050" cy="130" r="60" fill="#FFE9B8"/><circle cx="1050" cy="130" r="90" fill="#FFE9B8" opacity=".35"/>

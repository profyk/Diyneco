# Local Postgres + Redis for development. Not usable on machines without hardware
# virtualisation; see README "Running without Docker".
name: diyneco

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/docker/.env}
      DIYNECO_OWNER_PASSWORD: ${DIYNECO_OWNER_PASSWORD:?set in infra/docker/.env}
      DIYNECO_API_PASSWORD: ${DIYNECO_API_PASSWORD:?set in infra/docker/.env}
      DIYNECO_WORKER_PASSWORD: ${DIYNECO_WORKER_PASSWORD:?set in infra/docker/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/bootstrap.sql:/bootstrap/bootstrap.sql:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diyneco"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-superuser
      OWNER_PW: ci-owner
      API_PW: ci-api
      WORKER_PW: ci-worker
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --frozen
      - name: Bootstrap database roles and databases
        run: >
          psql -v ON_ERROR_STOP=1 -d postgres -f ../infra/db/bootstrap.sql
          -v owner_password="$OWNER_PW" -v api_password="$API_PW" -v worker_password="$WORKER_PW"
      - name: Write CI environment
        run: |
          {
            echo "APP_ENV=development"
            echo "API_BASE_URL=http://localhost:8000"
            echo "CORS_ALLOWED_ORIGINS=http://localhost:3001"
            echo "DATABASE_URL=postgresql+asyncpg://diyneco_api:$API_PW@localhost:5432/diyneco"
            echo "WORKER_DATABASE_URL=postgresql+asyncpg://diyneco_worker:$WORKER_PW@localhost:5432/diyneco"
            echo "MIGRATIONS_DATABASE_URL=postgresql+psycopg://diyneco_owner:$OWNER_PW@localhost:5432/diyneco"
            echo "TEST_DATABASE_URL=postgresql+asyncpg://diyneco_api:$API_PW@localhost:5432/diyneco_test"
            echo "TEST_WORKER_DATABASE_URL=postgresql+asyncpg://diyneco_worker:$WORKER_PW@localhost:5432/diyneco_test"
            echo "TEST_MIGRATIONS_DATABASE_URL=postgresql+psycopg://diyneco_owner:$OWNER_PW@localhost:5432/diyneco_test"
            uv run python scripts/gen_dev_keys.py
          } > .env
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Alembic upgrade from empty
        run: uv run alembic upgrade head
      - name: Migration check
        run: uv run python scripts/check_migrations.py
      - name: Migration round trip (downgrade to empty, upgrade again)
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run python scripts/check_migrations.py
      - name: Route tenancy check
        run: uv run python scripts/check_routes.py
      - name: Tests
        run: uv run pytest -q -ra --junitxml=pytest-report.xml
      - name: Restore drill (dump the test database, restore into an isolated one, verify)
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE diyneco_restore OWNER diyneco_owner"
          psql -v ON_ERROR_STOP=1 -d diyneco_restore -c "
            CREATE SCHEMA extensions AUTHORIZATION diyneco_owner;
            GRANT USAGE ON SCHEMA extensions TO diyneco_api, diyneco_worker;
            CREATE EXTENSION pgcrypto WITH SCHEMA extensions;
            CREATE EXTENSION citext WITH SCHEMA extensions;
            CREATE EXTENSION pg_trgm WITH SCHEMA extensions;
            CREATE EXTENSION btree_gin WITH SCHEMA extensions;"
          uv run python scripts/restore_drill.py \
            --source-url "postgresql://diyneco_owner:$OWNER_PW@localhost:5432/diyneco_test" \
            --target-url "postgresql://diyneco_owner:$OWNER_PW@localhost:5432/diyneco_restore" \
            --docker "${{ job.services.postgres.id }}"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-report
          path: backend/pytest-report.xml

  shared-types:
    name: Shared types are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:types
      - name: Fail if generated files changed
        run: git diff --exit-code -- packages/shared-types

  web:
    name: Web apps (type-check and production build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: https://api.example.invalid
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type-check shared packages and apps
        run: |
          checked=0
          for dir in packages/api-client packages/shared-ui apps/*/; do
            [ -f "$dir/package.json" ] && grep -q '"typecheck"' "$dir/package.json" || continue
            (cd "$dir" && pnpm typecheck)
            checked=$((checked + 1))
          done
          echo "::notice title=Type-checked::$checked packages and apps"
          [ "$checked" -ge 7 ]
      - name: Unit-test the API client (money parsing and formatting)
        run: pnpm --filter @diyneco/api-client test
      - name: Build every app
        # One app at a time; a failure is reported as an annotation with the build's error lines.
        run: |
          status=0
          for app in apps/*/; do
            name=$(basename "$app")
            [ -f "$app/package.json" ] || continue
            if ! (cd "$app" && pnpm build > "/tmp/build-$name.log" 2>&1); then
              status=1
              msg=$(grep -iE "error|failed|cannot|unexpected" "/tmp/build-$name.log" | head -15 | tr '\n' ' ' | cut -c1-1800)
              echo "::error title=Build failed: $name::$msg"
              tail -40 "/tmp/build-$name.log"
            else
              echo "::notice title=Built $name::$(grep -cE '^[├└┌]' "/tmp/build-$name.log") routes"
            fi
          done
          [ "$(ls -d apps/*/.next 2>/dev/null | wc -l)" -ge 5 ] || { echo "::error::not every app produced a build"; exit 1; }
          exit $status

  e2e:
    name: Browser end-to-end tests (all five apps)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-superuser
      OWNER_PW: ci-owner
      API_PW: ci-api
      WORKER_PW: ci-worker
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://localhost:8000
      E2E_BROWSER: chromium
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install Python and Node dependencies
        run: |
          (cd backend && uv sync --frozen)
          pnpm install --frozen-lockfile
      - name: Database, migrations and demo data
        working-directory: backend
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -f ../infra/db/bootstrap.sql \
            -v owner_password="$OWNER_PW" -v api_password="$API_PW" -v worker_password="$WORKER_PW"
          {
            echo "APP_ENV=development"
            echo "API_BASE_URL=http://localhost:8000"
            echo "CORS_ALLOWED_ORIGINS=http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005"
            echo "MERCHANT_APP_URL=http://localhost:3001"
            echo "ADMIN_APP_URL=http://localhost:3003"
            echo "DATABASE_URL=postgresql+asyncpg://diyneco_api:$API_PW@localhost:5432/diyneco"
            echo "WORKER_DATABASE_URL=postgresql+asyncpg://diyneco_worker:$WORKER_PW@localhost:5432/diyneco"
            echo "MIGRATIONS_DATABASE_URL=postgresql+psycopg://diyneco_owner:$OWNER_PW@localhost:5432/diyneco"
            uv run python scripts/gen_dev_keys.py
          } > .env
          uv run alembic upgrade head
          uv run python scripts/seed_dev.py
          uv run python scripts/seed_e2e.py > ../packages/e2e/.accounts.json
      - name: Start the API
        working-directory: backend
        run: nohup uv run uvicorn app.main:create_app --factory --port 8000 > /tmp/api.log 2>&1 &
      - name: Build and start the apps
        run: |
          for app in admin:3003 merchant:3001 kitchen:3002 room-service:3004 guest:3005; do
            name=${app%%:*}; port=${app##*:}
            (cd apps/$name && pnpm build) > /tmp/build-$name.log 2>&1 || { tail -40 /tmp/build-$name.log; exit 1; }
            (cd apps/$name && nohup npx next start --port $port > /tmp/$name.log 2>&1 &)
          done
      - name: Install the browser
        working-directory: packages/e2e
        run: npx playwright install --with-deps chromium
      - name: Wait for the servers
        run: |
          for url in http://localhost:8000/api/v1/health http://localhost:3003 http://localhost:3001 \
                     http://localhost:3002 http://localhost:3004 http://localhost:3005; do
            for i in $(seq 1 60); do curl -sf -o /dev/null "$url" && break; sleep 2; done
            curl -sf -o /dev/null "$url" || { echo "::error::$url did not start"; tail -40 /tmp/*.log; exit 1; }
          done
      - name: Run the browser tests
        working-directory: packages/e2e
        run: npx playwright test
      - name: Show server errors
        if: failure()
        run: |
          grep -hiE '"level": "error"|Traceback|Error' /tmp/api.log /tmp/admin.log /tmp/merchant.log \
            /tmp/kitchen.log /tmp/room-service.log /tmp/guest.log | tail -20 \
            | while IFS= read -r line; do echo "::warning title=Server log::${line:0:900}"; done

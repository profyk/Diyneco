name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci-superuser
      OWNER_PW: ci-owner
      API_PW: ci-api
      WORKER_PW: ci-worker
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --frozen
      - name: Bootstrap database roles and databases
        run: >
          psql -v ON_ERROR_STOP=1 -d postgres -f ../infra/db/bootstrap.sql
          -v owner_password="$OWNER_PW" -v api_password="$API_PW" -v worker_password="$WORKER_PW"
      - name: Write CI environment
        run: |
          {
            echo "APP_ENV=development"
            echo "API_BASE_URL=http://localhost:8000"
            echo "CORS_ALLOWED_ORIGINS=http://localhost:3001"
            echo "DATABASE_URL=postgresql+asyncpg://diyneco_api:$API_PW@localhost:5432/diyneco"
            echo "WORKER_DATABASE_URL=postgresql+asyncpg://diyneco_worker:$WORKER_PW@localhost:5432/diyneco"
            echo "MIGRATIONS_DATABASE_URL=postgresql+psycopg://diyneco_owner:$OWNER_PW@localhost:5432/diyneco"
            echo "TEST_DATABASE_URL=postgresql+asyncpg://diyneco_api:$API_PW@localhost:5432/diyneco_test"
            echo "TEST_WORKER_DATABASE_URL=postgresql+asyncpg://diyneco_worker:$WORKER_PW@localhost:5432/diyneco_test"
            echo "TEST_MIGRATIONS_DATABASE_URL=postgresql+psycopg://diyneco_owner:$OWNER_PW@localhost:5432/diyneco_test"
            uv run python scripts/gen_dev_keys.py
          } > .env
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Alembic upgrade from empty
        run: uv run alembic upgrade head
      - name: Migration check
        run: uv run python scripts/check_migrations.py
      - name: Migration round trip (downgrade to empty, upgrade again)
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run python scripts/check_migrations.py
      - name: Route tenancy check
        run: uv run python scripts/check_routes.py
      - name: Tests
        run: uv run pytest -q -ra --junitxml=pytest-report.xml
      - name: Restore drill (dump the test database, restore into an isolated one, verify)
        run: |
          psql -v ON_ERROR_STOP=1 -d postgres -c "CREATE DATABASE diyneco_restore OWNER diyneco_owner"
          psql -v ON_ERROR_STOP=1 -d diyneco_restore -c "
            CREATE SCHEMA extensions AUTHORIZATION diyneco_owner;
            GRANT USAGE ON SCHEMA extensions TO diyneco_api, diyneco_worker;
            CREATE EXTENSION pgcrypto WITH SCHEMA extensions;
            CREATE EXTENSION citext WITH SCHEMA extensions;
            CREATE EXTENSION pg_trgm WITH SCHEMA extensions;
            CREATE EXTENSION btree_gin WITH SCHEMA extensions;"
          uv run python scripts/restore_drill.py \
            --source-url "postgresql://diyneco_owner:$OWNER_PW@localhost:5432/diyneco_test" \
            --target-url "postgresql://diyneco_owner:$OWNER_PW@localhost:5432/diyneco_restore" \
            --docker "${{ job.services.postgres.id }}"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml

  shared-types:
    name: Shared types are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: uv sync --frozen
        working-directory: backend
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:types
      - name: Fail if generated files changed
        run: git diff --exit-code -- packages/shared-types

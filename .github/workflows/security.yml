name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 05:17 SAST

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Python (pip-audit)
        working-directory: backend
        run: |
          uv export --frozen --no-hashes --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict -r "$RUNNER_TEMP/requirements.txt"
      - name: JavaScript (pnpm audit, high and critical)
        run: pnpm audit --audit-level high

  frontend-secrets:
    name: No backend secrets in frontend code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Search apps and packages
        run: |
          if grep -rInE "SUPABASE_SERVICE_ROLE_KEY|JWT_|DATABASE_URL" apps packages \
               --exclude-dir=node_modules --exclude=README.md; then
            echo "::error::A frontend references a backend-only secret name."
            exit 1
          fi

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

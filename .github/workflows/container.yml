name: Backend image

# Builds the API/worker image and scans it on every backend change; on main it is also pushed
# to GitHub Container Registry, tagged with the commit hash. The deploy step to AWS or Railway
# is added once the hosting provider is final (docs/DECISIONS.md).

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/container.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/container.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: diyneco-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (fail on critical OS package vulnerabilities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: diyneco-backend:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$repo/backend:${{ github.sha }}"
          docker tag "diyneco-backend:${{ github.sha }}" "$image"
          docker push "$image"

<title>Diyneco Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: brand bar + app switcher on top; the selected app fills the stage; a live event stream runs beside it (below on phones). */
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --surface-2:#F7F9FC; --ink:#0B1F3F; --muted:#5A6A82; --line:#DCE3ED;
  --brand:#0B2350; --on-brand:#FFFFFF; --blue:#1E7FD8; --teal:#1FA9A1; --green:#13965F;
  --tint:#E8F1FB; --tint-teal:#E3F5F3; --warn:#9A5B07; --warn-bg:#FDF3E1; --crit:#B23A32; --crit-bg:#FBE9E7; --good:#13965F; --good-bg:#E4F5EC;
  --bezel:#1A2438; --guest-bg:#FBFCFE; --kds:#F3F6FA;
  --f-display:"Sora", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1222; --surface:#111C31; --surface-2:#0E182B; --ink:#E5ECF6; --muted:#93A3BB; --line:#24324D;
  --brand:#2F7FD6; --on-brand:#FFFFFF; --blue:#5AA6F0; --teal:#3CC7BE; --green:#3CC98A;
  --tint:#132A47; --tint-teal:#123634; --warn:#F0B661; --warn-bg:#33260F; --crit:#F08A80; --crit-bg:#3A1A18; --good:#3CC98A; --good-bg:#11301F;
  --bezel:#000000; --guest-bg:#0F1A2E; --kds:#0A1222; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1222; --surface:#111C31; --surface-2:#0E182B; --ink:#E5ECF6; --muted:#93A3BB; --line:#24324D;
  --brand:#2F7FD6; --on-brand:#FFFFFF; --blue:#5AA6F0; --teal:#3CC7BE; --green:#3CC98A;
  --tint:#132A47; --tint-teal:#123634; --warn:#F0B661; --warn-bg:#33260F; --crit:#F08A80; --crit-bg:#3A1A18; --good:#3CC98A; --good-bg:#11301F;
  --bezel:#000000; --guest-bg:#0F1A2E; --kds:#0A1222; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-0.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding-inline:16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.word{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.04em;color:var(--ink)}
.word b{color:var(--green);font-weight:700}
.tag{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.apps{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px;overflow-x:auto;max-width:100%;flex:1 1 auto;justify-content:flex-start}
.apps button{border:0;background:transparent;border-radius:999px;padding:7px 14px;white-space:nowrap;color:var(--muted);font-weight:500}
.apps button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.top-actions{display:flex;gap:8px;margin-left:auto}

.ctx{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px}
.ctx label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
select,input[type=text],input[type=number],input[type=password],input[type=email],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;max-width:100%}
textarea{width:100%;min-height:64px;resize:vertical}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;padding-bottom:40px}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:500;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--blue);padding-inline:6px}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:12px}
.muted{color:var(--muted)}
.small{font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--tint);color:var(--blue);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.quiet{background:var(--surface-2);color:var(--muted)}
.note{border-radius:10px;padding:10px 12px;background:var(--tint);color:var(--ink);font-size:13px}
.note.warn{background:var(--warn-bg)}
.note.crit{background:var(--crit-bg)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.r,th.r{text-align:right}
.money-list{display:grid;gap:6px}
.money-list div{display:flex;justify-content:space-between;gap:12px}
.money-list .total{border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.money-list .sub{color:var(--muted);font-size:13px}

/* events */
.events{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 100px);display:flex;flex-direction:column}
@media (max-width:980px){.events{position:static;max-height:none}}
.events ol{list-style:none;margin:8px 0 0;padding:0;overflow:auto;display:grid;gap:6px}
.events li{border-left:3px solid var(--teal);background:var(--surface-2);border-radius:0 8px 8px 0;padding:6px 10px;font-size:12px}
.events li .t{font-family:var(--f-mono);font-size:11.5px;color:var(--blue);font-weight:500}
.events li.err{border-left-color:var(--crit)}
.events li.err .t{color:var(--crit)}

/* guest tablet */
.devicebar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.tablet{border:10px solid var(--bezel);border-radius:28px;background:var(--guest-bg);min-height:600px;max-width:820px;overflow:hidden;display:flex;flex-direction:column}
@media (max-width:520px){.tablet{border-width:6px;border-radius:20px}}
.g-head{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);gap:10px}
.g-head .hotel{font-family:var(--f-display);font-weight:600}
.g-body{padding:20px;flex:1;display:flex;flex-direction:column;gap:16px;min-width:0}
.welcome{text-align:center;padding:40px 12px;display:grid;gap:10px;justify-items:center}
.welcome .over{letter-spacing:.24em;font-size:12px;color:var(--muted);text-transform:uppercase}
.welcome h1{font-size:clamp(26px,5vw,38px)}
.welcome .roomno{font-family:var(--f-display);font-size:18px;color:var(--teal);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px;text-align:left;display:grid;gap:4px;min-height:104px}
.tile strong{font-family:var(--f-display);font-size:16px}
.tile span{color:var(--muted);font-size:13px}
.tile.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.tile.primary span{color:var(--on-brand);opacity:.8}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.item{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.item h4{font-size:15px}
.item .desc{color:var(--muted);font-size:13px}
.item .meta{display:flex;gap:6px;flex-wrap:wrap}
.item .meta span{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.item .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.qty{display:inline-flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:600}
.qty b{min-width:18px;text-align:center}
.cartbar{position:sticky;bottom:0;background:var(--brand);color:var(--on-brand);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cartbar .btn{background:var(--on-brand);color:var(--brand);border-color:var(--on-brand)}
.steps{list-style:none;padding:0;margin:0;display:grid;gap:0}
.steps li{display:flex;gap:10px;align-items:center;padding:5px 0;color:var(--muted);font-size:13px}
.steps li i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal;font-size:11px}
.steps li.done{color:var(--ink)}
.steps li.done i{background:var(--green);border-color:var(--green);color:#fff}
.steps li.now i{border-color:var(--blue);box-shadow:0 0 0 3px var(--tint)}
.steps li.now{color:var(--ink);font-weight:600}

/* kitchen */
.kds{background:var(--kds)}
.kcounts{display:flex;gap:10px;flex-wrap:wrap}
.kcount{border-radius:12px;padding:10px 16px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-display);font-weight:600}
.kcount b{font-size:22px;margin-left:6px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.board{grid-template-columns:minmax(0,1fr)}}
.col h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;margin-bottom:12px}
.kcard.new{border-left:6px solid var(--blue)}
.kcard.prep{border-left:6px solid var(--warn)}
.kcard.ready{border-left:6px solid var(--green)}
.kcard .kh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.kcard .kh strong{font-family:var(--f-display);font-size:18px}
.kitems{display:grid;gap:6px}
.kitem{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-top:1px dashed var(--line)}
.kitem .q{font-family:var(--f-mono);font-weight:500;margin-right:6px}
.kbig{min-height:54px;font-size:16px;font-weight:600;border-radius:12px;width:100%}
.hv .kcard{font-size:16px}
.hv .kcard .kh strong{font-size:22px}
.hv .kbig{min-height:64px;font-size:18px}

/* room service */
.rs{max-width:520px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;margin-bottom:12px}
.rcard .due{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px}
.rcard .due b{font-family:var(--f-mono);font-size:20px}

/* merchant */
.mnav{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px}
.mnav button{border:0;background:none;padding:10px 12px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.mnav button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font-family:var(--f-mono);font-size:20px;font-weight:500;margin-top:2px}
.split{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2)}
.split span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.room{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;text-align:left;display:grid;gap:4px}
.room[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 2px var(--tint)}
.room strong{font-family:var(--f-display);font-size:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.form .two{grid-template-columns:1fr}}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,12,25,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:16px;max-width:560px;width:100%;padding:20px;display:grid;gap:14px;max-height:calc(100vh - 32px);overflow:auto;border:1px solid var(--line)}
.modal.wide{max-width:720px}
.bill{font-size:13px}
.bill .bh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:12px}
.bill h3{font-size:20px}

/* toast */
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:60;width:min(92vw,460px)}
.toast{background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:13px}
.toast.err{background:var(--crit);color:#fff}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}}
</style>

<div id="app"></div>

<script>
/* ============================================================
   DIYNECO PROTOTYPE — simulated backend + five interfaces
   All money is integer cents. Every API call is tenant-scoped.
   ============================================================ */
const PIN = '1234';
const VAT = 0.15;
const now = () => Date.now();
const uid = p => p + '_' + Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(m){ const neg = m < 0; m = Math.abs(Math.round(m)); const r = Math.floor(m/100), c = m % 100;
  let s = String(r).replace(/\B(?=(\d{3})+(?!\d))/g, ','); if (c) s += '.' + String(c).padStart(2,'0');
  return (neg ? '−' : '') + 'R' + s; }
const toMinor = v => { const n = Number(String(v).replace(/[^0-9.]/g,'')); return Number.isFinite(n) ? Math.round(n*100) : NaN; };
const clock = t => new Date(t).toLocaleTimeString('en-ZA', {hour:'2-digit', minute:'2-digit', hour12:false});
const dateStr = t => new Date(t).toLocaleDateString('en-ZA', {day:'numeric', month:'short', year:'numeric'});
function ago(t){ const m = Math.round((now()-t)/60000); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; return Math.floor(m/60) + ' h ' + (m%60) + ' min ago'; }
const DAY = 864e5;

class ApiError extends Error { constructor(code, msg){ super(msg); this.code = code; } }

/* Hotel staff accounts used by the management app (demo PIN 1234 for everyone).
   Permissions follow the role matrix in the Security and Compliance spec. */
const ALL = '*';
const USERS = {
  naledi:{name:'Naledi K.', role:'General Manager', perms:[ALL]},
  sipho:{name:'Sipho D.', role:'Receptionist', perms:['orders.read','orders.create','stays.manage','folio.charge','folio.adjust.request','payments.record','checkout.perform','rooms.status','menu.read']},
  ayanda:{name:'Ayanda M.', role:'Finance Manager', perms:['orders.read','folio.adjust.request','folio.adjust.approve','folio.discount','payments.record','reports.finance','audit.read','settings.read']}
};
function can(p){ const u = USERS[UI.user]; return u.perms.includes(ALL) || u.perms.includes(p); }
function need(p){ if (!can(p)) throw new ApiError('PERMISSION_DENIED', `${USERS[UI.user].role} does not have permission for this (${p})`); }
const userLabel = () => `${USERS[UI.user].name} (${USERS[UI.user].role})`;

/* ---------------- seed (development data only) ---------------- */
function seed(){
  const t = now();
  const S = {
    plans: [{id:'starter', name:'Starter', monthly:120000}, {id:'pro', name:'Professional', monthly:350000}, {id:'ent', name:'Enterprise', monthly:900000}],
    hotels: [
      {id:'h1', name:'Grand Example Hotel', short:'GEH', city:'Cape Town', address:'12 Beach Road, Sea Point, Cape Town, 8005', phone:'+27 21 555 0100', email:'reception@grandexample.example',
       status:'active', plan:'pro', vatRegistered:true, vatNo:'4123456789', roomChargeLimit:50000, roomCharging:true, feeMinor:5000, allowOverride:true, wifi:'GrandGuest', checkoutTime:'10:00', invoiceSeq:122, orderSeq:10481, created:t-86*DAY},
      {id:'h2', name:'Seabreeze Lodge', short:'SBL', city:'Knysna', address:'4 Lagoon Drive, Knysna, 6571', phone:'+27 44 555 0142', email:'stay@seabreeze.example',
       status:'active', plan:'starter', vatRegistered:false, vatNo:'', roomChargeLimit:150000, roomCharging:true, feeMinor:3000, allowOverride:false, wifi:'Seabreeze', checkoutTime:'10:30', invoiceSeq:40, orderSeq:2050, created:t-30*DAY}
    ],
    rooms: [], stays: [], folio: [], orders: [], payments: [], audit: [], events: [], idem: {}, pairings: [], adjustments: [], closes: {},
    stations: [
      {id:'main', hotelId:'h1', name:'Main Kitchen'}, {id:'bar', hotelId:'h1', name:'Bar'}, {id:'dessert', hotelId:'h1', name:'Dessert Station'},
      {id:'sb-k', hotelId:'h2', name:'Kitchen'}
    ],
    menu: [],
    devices: [
      {id:'DY-259-01', hotelId:'h1', roomId:'r_h1_259', type:'guest', status:'active', os:'Android 14', app:'1.0.0-proto', lastSeen:t},
      {id:'DY-104-01', hotelId:'h1', roomId:'r_h1_104', type:'guest', status:'active', os:'Android 13', app:'1.0.0-proto', lastSeen:t},
      {id:'KITCHEN-01', hotelId:'h1', roomId:null, type:'kitchen', status:'active', os:'Chrome 128', app:'web', lastSeen:t},
      {id:'SB-03-01', hotelId:'h2', roomId:'r_h2_3', type:'guest', status:'active', os:'Android 14', app:'1.0.0-proto', lastSeen:t},
      {id:'DY-NEW-07', hotelId:null, roomId:null, type:'guest', status:'unpaired', os:'Android 14', app:'1.0.0-proto', lastSeen:t}
    ]
  };
  const add = (hotelId, number, floor, type, rate, status) => S.rooms.push({id:`r_${hotelId}_${number}`, hotelId, number:String(number), floor, type, rateMinor:rate, status});
  [101,102,103,104].forEach(n => add('h1', n, 1, 'Standard', 120000, 'available'));
  [201,202,203,204].forEach(n => add('h1', n, 2, 'Deluxe', 150000, 'available'));
  add('h1', 259, 2, 'Deluxe', 150000, 'available');
  [1,2,3,4,5,6].forEach(n => add('h2', n, 1, 'Garden Suite', 95000, 'available'));
  S.rooms.find(r => r.id==='r_h1_102').status = 'cleaning';
  S.rooms.find(r => r.id==='r_h1_203').status = 'maintenance';

/* One set of order rules for tablet orders and staff-entered (phone) orders */
function createOrder(h, room, stay, lines, note, meta){
  if (!h.roomCharging) throw new ApiError('ROOM_CHARGE_DISABLED','This hotel does not allow charges to the room');
  if (stay.chargesBlocked) throw new ApiError('STAY_BLOCKED','Room charges are paused for this stay. Please contact reception.');
  if (!lines.length) throw new ApiError('EMPTY_ORDER','Add at least one item');
  const items = lines.map(l => { const m = scoped(S.menu, h.id, l.menuId, 'Menu item'); if (!isAvailableNow(m)) throw new ApiError('ITEM_UNAVAILABLE', `${m.name} is not available right now`);
    if (!Number.isInteger(l.qty) || l.qty < 1 || l.qty > 99) throw new ApiError('ORDER_TOO_LARGE','Quantity must be 1–99');
    return {id:uid('oi'), menuId:m.id, name:m.name, unitMinor:m.priceMinor, qty:l.qty, station:m.station, status:'pending'}; });
  const subtotal = items.reduce((a,i) => a + i.unitMinor*i.qty, 0), fee = h.feeMinor, total = subtotal + fee;
  const needsApproval = total > h.roomChargeLimit;
  const o = {id:uid('o'), no:++h.orderSeq, hotelId:h.id, stayId:stay.id, roomId:room.id, roomNo:room.number, deviceId:meta.deviceId || null, placedBy:meta.placedBy || null, lateReason:meta.lateReason || '',
    items, note, subtotal, fee, total, posted:false, status: needsApproval ? 'PENDING_APPROVAL' : 'NEW', createdAt:now(), history:[{s: needsApproval ? 'PENDING_APPROVAL' : 'NEW', at:now()}], adjustments:[], payment:null, delivery:{}};
  S.orders.push(o);
  if (!needsApproval) postOrder(o);
  audit(h.id, meta.placedBy || `Device ${meta.deviceId}`, 'order.create', `Order #${o.no}`, '', fmt(total) + (meta.placedBy ? ' · staff-entered' : '') + (o.lateReason ? ` · late: ${o.lateReason}` : ''));
  emit(needsApproval ? 'ORDER_PENDING_APPROVAL' : 'NEW_ORDER', h.id, `#${o.no} · Room ${o.roomNo} · ${fmt(total)}${meta.placedBy ? ' · by reception' : ''}`);
  return {orderId:o.id, no:o.no, status:o.status};
}
function postOrder(o){ if (o.posted) return; const lines = o.items.map(i => `${i.qty}× ${i.name}`).join(', ');
  post(o.hotelId, o.stayId, 'fb', 'Food & beverage', `Order #${o.no} · ${lines}`, o.subtotal, {orderId:o.id});
  post(o.hotelId, o.stayId, 'fb', 'Room-service fee', `Order #${o.no}`, o.fee, {orderId:o.id}); o.posted = true; }
function orderDue(o){ return o.total + o.adjustments.reduce((a,x) => a + (x.to - x.from), 0); }
const stationName = id => S.stations.find(s => s.id === id)?.name || id;
const SCHED = {'Breakfast':[6,11], 'Lunch & Dinner':[11,22], 'Snacks':[0,24], 'Drinks':[0,24], 'Desserts':[11,23]};
function isAvailableNow(m){ if (!m.available) return false; const [a,b] = SCHED[m.cat] || [0,24]; const hr = new Date().getHours(); return hr >= a && hr < b; }

function isolationChecks(){
  const res = []; const t = (name, fn) => { try { fn(); res.push({name, ok:false, detail:'request succeeded'}); } catch (e) { res.push({name, ok:e instanceof ApiError, detail:e.code || e.message}); } };
  const o1 = S.orders.find(o => o.hotelId==='h1'), st1 = S.stays.find(s => s.hotelId==='h1');
  t('Seabreeze kitchen accepts a Grand Example order', () => api.kitchenAccept('h2', o1.id));
  t('Seabreeze reception checks out a Grand Example stay', () => api.checkout('h2', st1.id, PIN, false, '', 'test'));
  t('Seabreeze adds a charge to a Grand Example folio', () => api.addCharge('h2', st1.id, 'Spa', 100, 'test'));
  t('Seabreeze edits a Grand Example menu price', () => api.updatePrice('h2', S.menu.find(m => m.hotelId==='h1').id, 1, 'test'));
  t('Seabreeze locks a Grand Example tablet', () => api.setDevice('h2', 'DY-259-01', 'locked', 'test'));
  t('Unknown device credential requests a session', () => api.guestSession('FORGED-001'));
  t('Checkout with a wrong PIN', () => api.checkout('h1', st1.id, '0000', false, '', 'test'));
  const g = api.guestOrders('SB-03-01'); res.push({name:'Seabreeze tablet sees only its own stay\'s orders', ok:g.every(o => o.hotelId==='h2'), detail:`${g.length} order(s) returned, all hotel h2`});
  emit('ISOLATION_CHECK', null, `${res.filter(r => r.ok).length}/${res.length} checks passed`);
  return res;
}

      <div class="form"><label>Manager PIN<input type="password" id="apPin" inputmode="numeric" maxlength="6"></label></div>
      <div class="row" style="justify-content:flex-end"><button class="btn" data-a="close">Cancel</button><button class="btn go" data-a="doapprove" data-id="${o.id}">Approve and send to kitchen</button></div></div></div>`; }
  if (m.type === 'pairing') return `<div class="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mpc"><h3 id="mpc">Pairing code for Room ${m.room}</h3>
      <div class="mono" style="font-size:40px;letter-spacing:.2em;text-align:center">${m.code}</div><p class="small muted" style="margin:0;text-align:center">Valid for 15 minutes, single use. Enter it on the tablet's "Pair this device" screen.</p>
      <div class="row" style="justify-content:flex-end"><button class="btn" data-a="close">Done</button><button class="btn primary" data-a="gotoPair">Open DY-NEW-07</button></div></div></div>`;
  if (m.type === 'checkout') { const st = S.stays.find(s => s.id===m.id), f = folioSummary(st.id), h = hotelOf(st.hotelId);
    if (!m.key) m.key = uid('idem');
    return `<div class="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mc">
      <h3 id="mc">Guest check out · Room ${st.roomNo}</h3><div class="small muted">${esc(st.guest)}${st.billing.type==='company' ? ' · ' + esc(st.billing.company) : ''}</div>
      <div class="money-list"><div><span>Accommodation</span><span class="num">${fmt(f.acc)}</span></div><div><span>F&B</span><span class="num">${fmt(f.fb)}</span></div><div><span>Other services</span><span class="num">${fmt(f.other)}</span></div><div><span>Tips</span><span class="num">${fmt(f.tips)}</span></div>
        <div class="total"><span>Total</span><span class="num">${fmt(f.totalWithTips)}</span></div><div class="sub"><span>Payments received (excl. tips)</span><span class="num">${fmt(-f.paid)}</span></div>
        <div class="total" style="font-size:17px"><span>Outstanding balance</span><span class="num" style="color:${f.balance>0?'var(--crit)':'var(--good)'}">${fmt(f.balance)}</span></div></div>
      ${f.balance > 0 ? `<div class="note crit">Outstanding balance: <b>${fmt(f.balance)}</b>. Take payment before checkout${h.allowOverride ? ', or use a manager override' : ''}.</div>
        <div class="form"><div class="two"><label>Payment amount (R)<input type="number" id="coPay" value="${(f.balance/100).toFixed(2)}" step="0.01" min="0"></label><label>Method<select id="coMethod"><option value="card_terminal">Card terminal</option><option value="eft">EFT</option><option value="cash">Cash</option></select></label></div>
        <button class="btn" data-a="copay" data-id="${st.id}">Record payment</button>
        ${h.allowOverride ? `<label><span><input type="checkbox" id="coOverride"> Manager override: check out with balance</span></label><label>Override reason<input type="text" id="coReason" maxlength="120" placeholder="e.g. Company account, invoice to follow"></label>` : ''}</div>` : `<div class="note">Balance settled. Ready to check out.</div>`}
      <div class="form"><label>Bill delivery<select id="coDeliver"><option>Download PDF</option><option>Email</option><option>Print</option><option>Print + Email</option></select></label>
        <p class="small muted" style="margin:0">PDF, print and email are built in Phase 6. The prototype shows the bill on screen.</p>
        <label>Authorisation PIN<input type="password" id="coPin" inputmode="numeric" maxlength="6" placeholder="1234"></label></div>
      <div class="row" style="justify-content:flex-end"><button class="btn" data-a="close">Cancel</button><button class="btn primary" data-a="docheckout" data-id="${st.id}">Confirm guest checkout</button></div></div></div>`; }
  if (m.type === 'bill') return `<div class="scrim"><div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="mb">${billHtml(m.id)}<div class="row" style="justify-content:flex-end"><button class="btn primary" data-a="close">Close</button></div></div></div>`;
  return '';
}
function billHtml(stayId){
  const st = S.stays.find(s => s.id===stayId), h = hotelOf(st.hotelId), f = st.final || folioSummary(st.id), b = st.billing;
  const label = h.vatRegistered && h.vatNo ? 'Tax Invoice' : 'Guest Statement';
  const rows = g => f.entries.filter(e => e.group===g).map(e => `<tr><td>${dateStr(e.at)}</td><td>${esc(e.category)}${e.desc && e.desc!==e.category ? `<div class="small muted">${esc(e.desc)}</div>` : ''}</td><td class="r num">${fmt(g==='pay' ? -e.amount : e.amount)}</td></tr>`).join('');
  const vatIncl = Math.round((f.fb + f.other) * VAT / (1+VAT)), accVat = f.entries.filter(e => e.category==='Accommodation tax').reduce((a,e) => a+e.amount, 0);
  return `<div class="bill stack">
    <div class="bh"><div class="row" style="align-items:flex-start;gap:12px">${LOGO.replace('<svg','<svg width="40" height="40"')}<div><h3>${esc(h.name)}</h3><div class="small muted">${esc(h.address)}<br>${esc(h.phone)} · ${esc(h.email)}${h.vatRegistered && h.vatNo ? `<br>VAT no. ${esc(h.vatNo)}` : ''}</div></div></div>
      <div style="text-align:right"><div class="eyebrow">${label}</div><div class="mono" style="font-size:15px">${st.invoiceNo || 'DRAFT · not issued'}</div><div class="small muted">${dateStr(st.checkOut || now())}</div></div></div>
    <div class="grid2"><div><div class="eyebrow">Billed to</div>${b.type==='company' ? `<b>${esc(b.company)}</b><div class="small">Reg. ${esc(b.reg||'—')} · VAT ${esc(b.vat||'—')}<br>${esc(b.address||'')}<br>${esc(b.email||'')}</div>` : `<b>${esc(st.guest)}</b>`}</div>
      <div><div class="eyebrow">Stay</div><div class="small">${b.type==='company' ? `Traveller: ${esc(b.traveller || st.guest)}<br>Reference: ${esc(b.ref||'—')}<br>` : ''}Room ${st.roomNo} · ${dateStr(st.checkIn)} – ${dateStr(st.checkOut || st.expectedOut)}</div></div></div>
    <div class="tablewrap"><table><thead><tr><th>Date</th><th>Description</th><th class="r">Amount</th></tr></thead><tbody>
      <tr><td colspan="3" class="eyebrow">Accommodation</td></tr>${rows('acc')}
      ${f.fb ? `<tr><td colspan="3" class="eyebrow">Food & beverage</td></tr>${rows('fb')}` : ''}
      ${f.other ? `<tr><td colspan="3" class="eyebrow">Other services</td></tr>${rows('other')}` : ''}
      ${f.paid ? `<tr><td colspan="3" class="eyebrow">Payments</td></tr>${rows('pay')}` : ''}
    </tbody></table></div>
    <div class="money-list" style="max-width:340px;margin-left:auto"><div><span>Charges</span><span class="num">${fmt(f.charges)}</span></div><div class="sub"><span>of which accommodation VAT</span><span class="num">${fmt(accVat)}</span></div><div class="sub"><span>of which VAT in F&B and services (15/115)</span><span class="num">${fmt(vatIncl)}</span></div>
      <div><span>Payments</span><span class="num">${fmt(-f.paid)}</span></div><div class="total"><span>Balance</span><span class="num">${fmt(f.balance)}</span></div>
      <div class="sub"><span>Tips received (staff, not hotel revenue)</span><span class="num">${fmt(f.tips)}</span></div></div>
    ${st.override ? `<div class="note warn">Checked out with balance by manager override: ${esc(st.override)}</div>` : ''}
    <p class="small muted" style="margin:0">Generated by Diyneco. Card details are never stored.</p></div>`;
}

/* ---------------- ACTIONS ---------------- */
const A = {
  app:d => { UI.app = d.k; UI.modal = null; render(); window.scrollTo(0,0); },
  restart:() => { S = seed(); SEQ = 0; UI = {...UI, user:'naledi', staffLines:[], staffKey:null, guestView:'home', carts:{}, cartKeys:{}, lastOrder:{}, payKeys:{}, lastPay:{}, modal:null, isolation:null, room:'r_h1_259', hotel:'h1', device:'DY-259-01'}; boot(); toast('Demo data restored'); },
  gview:d => { UI.guestView = d.v; render(); },
  gcat:d => { UI.guestCat = d.v; render(); },
  qty:d => { const c = cartOf(); c[d.id] = Math.max(0, (c[d.id]||0) + Number(d.d)); if (!c[d.id]) delete c[d.id]; UI.cartKeys[UI.device] = null; render(); },
  sample:() => { const s = api.guestSession(UI.device), menu = api.guestMenu(UI.device), by = n => menu.find(m => m.name===n);
    const c = {}; [['Ribeye Steak 300g',4],['Chicken Burger',2],['Coca-Cola 330ml',2],['Cabernet Sauvignon (bottle)',1]].forEach(([n,q]) => { const m = by(n); if (m && isAvailableNow(m)) c[m.id] = q; });
    if (!Object.keys(c).length) return toast('Spec items are outside serving hours right now', true);
    UI.carts[UI.device] = c; UI.cartKeys[UI.device] = null; UI.guestView = 'cart'; render(); },
  place:() => { const c = cartOf(), key = UI.cartKeys[UI.device] || (UI.cartKeys[UI.device] = uid('idem'));
    const lines = Object.entries(c).map(([menuId,qty]) => ({menuId, qty}));
    const r = run(() => api.placeOrder(UI.device, lines, val('gnote'), key));
    if (r) { UI.lastOrder[UI.device] = {...r, lines, note:val('gnote'), key}; UI.carts[UI.device] = {}; UI.guestView = 'orders'; toast(r.status==='PENDING_APPROVAL' ? `Order #${r.no} sent for manager approval` : `Order #${r.no} placed and charged to your room`); } },
  retryOrder:() => { const l = UI.lastOrder[UI.device]; const r = run(() => api.placeOrder(UI.device, l.lines, l.note, l.key));
    if (r) { emit('IDEMPOTENT_REPLAY', api.guestSession(UI.device).hotel.id, `Order create retried with same key → returned #${r.no}, no duplicate`); toast(`Server returned order #${r.no} again. No duplicate created.`); } },
  pair:() => { const code = val('pairCode').trim(); const r = run(() => api.pair(UI.device, code, 'pair-' + UI.device + '-' + code)); if (r) toast(`Paired to Room ${r.room}`); },
  kaccept:d => run(() => api.kitchenAccept(UI.hotel, d.id)),
  kstart:d => run(() => api.kitchenStart(UI.hotel, d.id)),
  kitem:d => run(() => api.itemReady(UI.hotel, d.id, d.i)),
  kall:d => { const o = S.orders.find(x => x.id===d.id); run(() => o.items.filter(i => i.status!=='ready' && (UI.kitchenStation==='all' || i.station===UI.kitchenStation)).forEach(i => api.itemReady(UI.hotel, o.id, i.id))); },
  claim:d => run(() => api.claim(UI.hotel, d.id, UI.staff), 'Delivery assigned to you'),
  pickup:d => run(() => api.pickUp(UI.hotel, d.id, UI.staff)),
  deliver:d => run(() => api.deliver(UI.hotel, d.id, UI.staff)),
  leave:d => run(() => api.leaveOnRoom(UI.hotel, d.id, UI.staff), 'Left on the room bill'),
  checkpay:d => { const received = toMinor(val('rcv-' + d.id)), ref = val('ref-' + d.id).trim();
    const p = run(() => api.previewPayment(UI.hotel, d.id, received)); if (!p) return;
    if (!/^[A-Za-z0-9-]{4,20}$/.test(ref)) return run(() => { throw new ApiError('REF_REQUIRED','Enter the terminal approval reference (4–20 letters or digits)'); });
    const pending = {orderId:d.id, received, ref, key:UI.payKeys[d.id]};
    if (p.diff === 0) return A.confirmpay(null, pending);
    UI.modal = {type:'tip', preview:p, pending}; render(); },
  confirmpay:(d, direct) => { const pd = direct || UI.modal.pending; const tip = (UI.modal?.preview?.tip || 0) > 0;
    const r = run(() => api.recordCardPayment(UI.hotel, pd.orderId, pd.received, pd.ref, tip, UI.staff, pd.key));
    if (r) { UI.lastPay[pd.orderId] = {...pd, tip}; UI.modal = null; toast(r.tip ? `Bill ${fmt(r.applied)} and tip ${fmt(r.tip)} recorded` : r.shortfall ? `Part payment recorded. ${fmt(r.shortfall)} stays on the room bill` : 'Payment recorded'); } },
  retryPay:d => { const l = UI.lastPay[d.id]; const r = run(() => api.recordCardPayment(UI.hotel, d.id, l.received, l.ref, l.tip, UI.staff, l.key));
    if (r) { emit('IDEMPOTENT_REPLAY', UI.hotel, `Payment retried with same key → original returned, no duplicate`); toast('Server returned the original payment. No duplicate charge or tip.'); } },
  mtab:d => { UI.mtab = d.k; render(); },
  room:d => { UI.room = d.id; render(); },
  approve:d => { UI.modal = {type:'approve', id:d.id}; render(); },
  doapprove:d => { if (run(() => api.approveOrder(UI.hotel, d.id, val('apPin'), actorFor()) ?? true, 'Approved and sent to the kitchen')) { UI.modal = null; render(); } },
  decline:d => run(() => api.declineOrder(UI.hotel, d.id, actorFor()), 'Order declined'),
  adjust:d => { UI.modal = {type:'adjust', id:d.id}; render(); },
  doadjust:d => { if (run(() => api.requestAdjustment(UI.hotel, d.id, toMinor(val('adjAmt')), val('adjReason')), 'Sent for approval by a second person')) { UI.modal = null; render(); } },
  adjapprove:d => { UI.modal = {type:'adjapprove', id:d.id}; render(); },
  doadjapprove:d => { if (run(() => api.approveAdjustment(UI.hotel, d.id, val('aaPin')) ?? true, 'Adjustment approved, posted and audited')) { UI.modal = null; render(); } },
  adjreject:d => run(() => api.rejectAdjustment(UI.hotel, d.id), 'Adjustment rejected'),
  cancel:d => { UI.modal = {type:'cancel', id:d.id}; render(); },
  docancel:d => { if (run(() => api.cancelOrder(UI.hotel, d.id, val('cxReason'), val('cxPin')) ?? true, 'Order cancelled and charge reversed')) { UI.modal = null; render(); } },
  block:d => run(() => api.setChargesBlocked(UI.hotel, d.id, d.v === '1'), d.v === '1' ? 'Tablet charges paused for this stay' : 'Tablet charges allowed'),
  soadd:() => { const q = Number(val('soQty')); if (!Number.isInteger(q) || q < 1 || q > 99) return toast('Quantity must be 1–99', true); UI.soRoom = val('soRoom'); UI.staffLines.push({menuId:val('soItem'), qty:q}); UI.staffKey = null; render(); },
  sorm:d => { UI.soRoom = val('soRoom'); UI.staffLines.splice(Number(d.i), 1); UI.staffKey = null; render(); },
  soplace:() => { const key = UI.staffKey || (UI.staffKey = uid('idem'));
    const r = run(() => api.placeStaffOrder(UI.hotel, val('soRoom'), UI.staffLines, val('soNote'), val('soLate'), key));
    if (r) { UI.staffLines = []; UI.staffKey = null; toast(r.status==='PENDING_APPROVAL' ? `Order #${r.no} needs approval (over the limit)` : `Order #${r.no} sent to the kitchen`); } },
  dcsave:() => run(() => api.saveDailyClose(UI.hotel, toMinor(val('dcTerm') || 0), toMinor(val('dcCash') || 0), false)),
  dcreview:() => run(() => api.saveDailyClose(UI.hotel, toMinor(val('dcTerm') || 0), toMinor(val('dcCash') || 0), true), 'Day marked reviewed'),
  checkin:d => { const type = val('ciType'); const billing = type==='company' ? {type, company:val('ciCo'), reg:val('ciReg'), vat:val('ciVat'), ref:val('ciRef'), address:val('ciAddr'), email:val('ciCoEmail'), traveller:val('ciName')} : {type:'personal'};
    run(() => api.checkIn(UI.hotel, d.id, {guest:val('ciName'), email:val('ciEmail'), nights:Number(val('ciNights')), billing, training:document.getElementById('ciTraining')?.checked}, actorFor(), uid('idem')), 'Guest checked in. Tablet activated.'); },
  addcharge:d => run(() => api.addCharge(UI.hotel, d.id, val('chgCat'), toMinor(val('chgAmt')), actorFor()), 'Charge added to folio'),
  bill:d => { UI.modal = {type:'bill', id:d.id}; render(); },
  checkout:d => { UI.modal = {type:'checkout', id:d.id}; render(); },
  copay:d => run(() => api.recordFolioPayment(UI.hotel, d.id, toMinor(val('coPay')), val('coMethod'), actorFor(), uid('idem')), 'Payment recorded'),
  docheckout:d => { const ov = document.getElementById('coOverride')?.checked || false;
    const r = run(() => api.checkout(UI.hotel, d.id, val('coPin'), ov, val('coReason'), actorFor(), UI.modal.key));
    if (r) { S.devices.filter(x => x.roomId === S.stays.find(s => s.id===d.id).roomId).forEach(x => { UI.carts[x.id] = {}; UI.lastOrder[x.id] = null; if (UI.device === x.id) UI.guestView = 'home'; });
      UI.modal = {type:'bill', id:d.id}; toast(`Checked out. Bill ${r.invoiceNo}. Room tablet reset.`); } },
  rstatus:d => run(() => api.setRoomStatus(UI.hotel, d.id, d.s, actorFor())),
  price:d => run(() => api.updatePrice(UI.hotel, d.id, toMinor(val('pr-' + d.id)), actorFor()), 'Price saved. Past orders unchanged.'),
  toggleItem:d => run(() => api.toggleItem(UI.hotel, d.id, actorFor())),
  dev:d => run(() => api.setDevice(UI.hotel, d.id, d.s, actorFor())),
  devreset:d => { if (run(() => api.resetDevice(UI.hotel, d.id, actorFor()), 'Tablet returned to its welcome screen')) { UI.carts[d.id] = {}; if (UI.device===d.id) UI.guestView = 'home'; render(); } },
  mkpair:() => { const r = run(() => api.createPairing(UI.hotel, val('pairRoom'), actorFor())); if (r) { UI.modal = {type:'pairing', ...r}; render(); } },
  gotoPair:() => { UI.modal = null; UI.app = 'guest'; UI.device = 'DY-NEW-07'; if (!S.devices.find(d => d.id==='DY-NEW-07')) S.devices.push({id:'DY-NEW-07', hotelId:null, roomId:null, type:'guest', status:'unpaired', os:'Android 14', app:'1.0.0-proto', lastSeen:now()}); render(); },
  savesettings:() => { const lim = toMinor(val('setLimit')), fee = toMinor(val('setFee'));
    if (!Number.isInteger(lim) || !Number.isInteger(fee)) return toast('Enter valid amounts', true);
    run(() => api.updateSettings(UI.hotel, {roomChargeLimit:lim, feeMinor:fee, roomCharging:document.getElementById('setCharge').checked, allowOverride:document.getElementById('setOverride').checked, vatRegistered:document.getElementById('setVat').checked, vatNo:val('setVatNo').trim()}, actorFor()), 'Settings saved'); },
  suspend:d => run(() => api.adminSetStatus(d.id, 'suspended'), 'Hotel suspended. Its tablets now show "Service unavailable".'),
  reactivate:d => run(() => api.adminSetStatus(d.id, 'active'), 'Hotel reactivated'),
  isocheck:() => { UI.isolation = isolationChecks(); render(); },
  close:() => { UI.modal = null; render(); }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b || b.disabled) return; const f = A[b.dataset.a]; if (f) { e.preventDefault(); f(b.dataset); } });
document.addEventListener('change', e => { const c = e.target.dataset?.c; if (!c) return; const v = e.target.value;
  if (c==='hotel') { UI.hotel = v; UI.kitchenStation = 'all'; }
  if (c==='device') { UI.device = v; UI.guestView = 'home'; }
  if (c==='station') UI.kitchenStation = v;
  if (c==='hv') UI.hv = e.target.checked;
  if (c==='staff') UI.staff = v;
  if (c==='user') { UI.user = v; UI.modal = null; }
  if (c==='citype') { UI.ciType = v; const keep = {n:val('ciName'), ni:val('ciNights'), em:val('ciEmail')}; render(); const s = (id,x) => { const el = document.getElementById(id); if (el) el.value = x; }; s('ciName',keep.n); s('ciNights',keep.ni); s('ciEmail',keep.em); return; }
  if (c==='plan') { run(() => api.adminSetPlan(e.target.dataset.id, v), 'Plan changed'); return; }
  render(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.modal) { UI.modal = null; render(); } });
setInterval(() => { if (!UI.modal && !document.activeElement?.matches('input,textarea,select')) { S.devices.forEach(d => { if (d.hotelId && d.status !== 'unpaired') d.lastSeen = now(); }); render(); } }, 30000);
render();
